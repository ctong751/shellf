name: shellf

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shellf
      POSTGRES_PASSWORD: shellf
      POSTGRES_DB: shellf
    ports:
      - '5432:5432'
    volumes:
      - shellf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shellf -d shellf']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shellf_postgres_data:
